format = """
$username\
$hostname\
$directory\
${custom.jj}\
$git_state\
$cmd_duration\
$line_break\
$character"""

# prompt wide configuration settings
add_newline = true
scan_timeout = 10
# command_timeout = 750

[username]
format = "[$user]($style) "

[hostname]
ssh_symbol = ""
format = "on [$hostname](red) "

[directory]
style = "blue"
truncation_length = 5
truncation_symbol = ".../"
truncate_to_repo = false

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "

[git_branch]
disabled = true

[git_status]
disabled = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#d2a6ff"

[custom.jj]
when = "jj-starship detect"
shell = ["jj-starship"]
format = "[$output]($style) "
style = "#ffb454"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[package]
disable = true
